<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' fill='%23fafafa' text-anchor='middle'%3Eml%3C/text%3E%3C/svg%3E" />
<title>MLAI Bridge</title>
<script>
  // Apply the saved theme before first paint (no light flash in dark mode). Mirrors ThemeProvider.
  (function () {
    var t = localStorage.getItem("mlaiTheme") || "system";
    if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.classList.add(t);
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
